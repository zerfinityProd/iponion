<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="description" content="Unbiased IPO Insights.">
    <meta name="theme-color" content="#228b22">
    <title>Iponion - Unbiased IPO Insights</title>
    <link rel="icon" href="./assets/logo.svg">

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="./style.css?v=4">
</head>

<body>
    <div class="wrap">
        <header>
            <div class="header-top-bar">
                <button id="theme-toggle" title="Toggle Light / Dark Mode" aria-label="Toggle Theme">
                    <svg class="theme-icon sun-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <svg class="theme-icon moon-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
            </div>
            <a href="./" class="logo-container" title="IPONION">
                <svg class="brand-svg-logo" width="250" height="65" viewBox="0 0 250 65" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="IPONION">
                    <rect x="6" y="32" width="11" height="18" rx="2.5" fill="#00FF00" opacity="0.45"/>
                    <rect x="21" y="20" width="11" height="30" rx="2.5" fill="#00FF00" opacity="0.75"/>
                    <rect x="36" y="8" width="11" height="42" rx="2.5" fill="#00FF00"/>
                    <text x="60" y="42" class="logo-text"><tspan class="logo-ipo">IPO</tspan><tspan class="logo-nion">NION</tspan></text>
                </svg>
            </a>
            <div>
                <h2><span class="live-pulse-dot"></span>LIVE</h2>
            </div>
            <h3>Unbiased IPO Insights for Smart Investors</h3>
        </header>

        <main id="main">
            <div id="ipo-table-container">
                <div class="empty-message">Loading IPO insights...</div>
            </div>
        </main>

        <footer>
            <span>By <a href="https://www.zerfinity.com" target="_blank" rel="noopener noreferrer">Zerfinity</a></span> <span class="footer-divider">||</span> <a href="mailto:service@zerfinity.com">service@zerfinity.com</a>
        </footer>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // Theme Toggle
            const themeToggle = document.getElementById('theme-toggle');
            const body = document.body;

            function applyTheme(theme) {
                if (theme === 'dark') {
                    body.classList.add('dark-mode');
                } else {
                    body.classList.remove('dark-mode');
                }
            }

            const savedTheme = localStorage.getItem('iponion-theme') || 
                (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            applyTheme(savedTheme);

            themeToggle.addEventListener('click', () => {
                const isDark = body.classList.contains('dark-mode');
                const nextTheme = isDark ? 'light' : 'dark';
                applyTheme(nextTheme);
                localStorage.setItem('iponion-theme', nextTheme);
            });

            // Data Fetching with Local & Remote Fallbacks
            async function fetchIPOData() {
                const endpoints = [
                    './merged_ipo_data.json',
                    '../merged_ipo_data.json',
                    'https://raw.githubusercontent.com/zerfinityProd/iponion/main/merged_ipo_data.json',
                    'https://cdn.jsdelivr.net/gh/zerfinityProd/iponion@main/merged_ipo_data.json',
                    'https://zerfinityprod.github.io/iponion/merged_ipo_data.json'
                ];
                for (const url of endpoints) {
                    try {
                        const res = await fetch(url);
                        if (res.ok) {
                            return await res.json();
                        }
                    } catch (e) {
                        // try next endpoint
                    }
                }
                throw new Error('All data endpoints failed');
            }

            // Helpers
            const getGMP = ipo => {
                const val = ipo['IPO GMP'] ?? ipo['IPO GMP*'] ?? ipo['GMP'];
                return Number(val) || 0;
            };

            const getApps = ipo => Number(ipo['Total (X)']) || 0;

            const getName = ipo => ipo['IPO'] || ipo['IPO Name'] || ipo['Normalized_IPO_Name'] || '-';

            const getType = ipo => ipo['Type'] || ipo['Type_sub'] || '';

            function parseGainPercentage(estListing) {
                if (!estListing) return null;
                const match = estListing.match(/\(([\d.]+)%\)/);
                return match ? parseFloat(match[1]) : null;
            }

            // Create Clean Table
            function createSection(ipos, title, isTop5Highlight = false) {
                const section = document.createElement('section');
                section.className = 'ipo-section';
                if (title.toLowerCase().includes('closed')) {
                    section.classList.add('closed-ipo-section');
                }

                const header = document.createElement('div');
                header.className = 'ipo-section-header';
                header.innerHTML = `
                    <h3>${title}</h3>
                    <span class="ipo-section-count">${ipos.length} ${ipos.length === 1 ? 'record' : 'records'}</span>
                `;
                section.appendChild(header);

                if (ipos.length === 0) {
                    const empty = document.createElement('div');
                    empty.className = 'empty-message';
                    empty.textContent = 'No IPOs currently available.';
                    section.appendChild(empty);
                    return section;
                }

                const wrapper = document.createElement('div');
                wrapper.className = 'table-wrapper';

                const table = document.createElement('table');
                const thead = document.createElement('thead');
                const tbody = document.createElement('tbody');

                const isUpcoming = title.toLowerCase().includes('upcoming');

                // Standard unified column definitions across all tables for consistent grid alignment
                const cols = [
                    { key: 'company', label: 'IPO Name', align: 'left' },
                    { key: 'dates', label: 'Dates', align: 'left' },
                    { key: 'price', label: 'Price Band', align: 'right' },
                    { key: 'gmp', label: 'IPO GMP', align: 'right' },
                    { key: 'trend', label: 'Trend', align: 'center' },
                    { key: 'gain', label: 'Est. Gain', align: 'right' },
                    { key: 'retail', label: 'Retail (X)', align: 'right' },
                    { key: 'total', label: 'Total (X)', align: 'right' },
                    { key: 'status', label: 'Status', align: 'left' },
                    { key: 'updated', label: 'Last Updated', align: 'left' }
                ];

                // Render Header Row
                const hRow = document.createElement('tr');
                cols.forEach(col => {
                    const th = document.createElement('th');
                    th.textContent = col.label;
                    th.className = `col-${col.key}`;
                    if (col.align === 'right') th.classList.add('col-num');
                    if (col.align === 'center') th.style.textAlign = 'center';
                    hRow.appendChild(th);
                });
                thead.appendChild(hRow);
                table.appendChild(thead);

                // Render Body Rows
                ipos.forEach((ipo, index) => {
                    const row = document.createElement('tr');
                    if (isTop5Highlight && index < 5) {
                        row.classList.add('highlight-top-5');
                    }

                    const name = getName(ipo);
                    const type = getType(ipo);
                    const dateText = ipo['Date'] || (ipo['Opening Date'] && ipo['Closing Date'] ? `${ipo['Opening Date']} – ${ipo['Closing Date']}` : (ipo['Opening Date'] || ipo['Closing Date'] || '-'));
                    const price = ipo['Price Band'] || '-';
                    const gmp = getGMP(ipo);
                    const trend = ipo['Trend'] || '🟡';
                    const estListing = ipo['Est. Listing'] || '-';
                    const retail = ipo['Retail  (X)'] || ipo['Retail (X)'] || '-';
                    const total = Number(ipo['Total (X)']) || 0;
                    const status = ipo['Status'] || (isUpcoming ? 'Upcoming' : 'Open');
                    const updated = ipo['Last Updated_gmp'] || ipo['Last Updated'] || ipo['Last Updated_sub'] || '-';

                    // Formatted Gain
                    const gainPercent = parseGainPercentage(estListing);
                    let gainHtml = estListing;
                    if (gainPercent !== null) {
                        const cls = gainPercent > 0 ? 'positive' : (gainPercent === 0 ? 'flat' : 'negative');
                        const sign = gainPercent > 0 ? '+' : '';
                        const estPrice = estListing.split('(')[0].trim();
                        gainHtml = `<span class="gain-pill ${cls}"><span class="gain-price">${estPrice} </span>(${sign}${gainPercent}%)</span>`;
                    }

                    // Formatted Status
                    const isStatusOpen = String(status).toLowerCase() === 'open' || String(status).toLowerCase() === 'active';
                    const statusHtml = `<span class="status-tag ${isStatusOpen ? 'open' : ''}">${status}</span>`;

                    cols.forEach(col => {
                        const td = document.createElement('td');
                        td.className = `col-${col.key}`;
                        if (col.align === 'right') td.classList.add('col-num');

                        switch(col.key) {
                            case 'company':
                                td.innerHTML = `${name}${type ? `<span class="company-type-sub">${type}</span>` : ''}`;
                                break;
                            case 'dates':
                                td.textContent = dateText;
                                break;
                            case 'price':
                                td.textContent = price;
                                break;
                            case 'gmp':
                                td.textContent = `₹${gmp}`;
                                break;
                            case 'trend':
                                td.style.textAlign = 'center';
                                td.textContent = trend;
                                break;
                            case 'gain':
                                td.innerHTML = gainHtml;
                                break;
                            case 'retail':
                                td.textContent = retail !== '-' ? `${retail}x` : '-';
                                break;
                            case 'total':
                                td.style.fontWeight = '600';
                                td.textContent = total > 0 ? `${total.toFixed(2)}x` : '-';
                                break;
                            case 'status':
                                td.innerHTML = statusHtml;
                                break;
                            case 'updated':
                                td.style.fontSize = '0.75rem';
                                td.style.color = 'var(--text-muted)';
                                td.textContent = updated;
                                break;
                        }
                        row.appendChild(td);
                    });

                    tbody.appendChild(row);
                });

                table.appendChild(tbody);
                wrapper.appendChild(table);
                section.appendChild(wrapper);
                return section;
            }

            // Load and Process Data
            fetchIPOData()
                .then(data => {
                    const tableContainer = document.getElementById('ipo-table-container');
                    tableContainer.innerHTML = '';

                    if (!data || data.length === 0) {
                        tableContainer.innerHTML = '<div class="empty-message">No IPO data found.</div>';
                        return;
                    }

                    const today = new Date();

                    const activeIPOs = data.filter(ipo => {
                        if (ipo['Status']) {
                            const st = String(ipo['Status']).trim().toLowerCase();
                            return st === 'open' || st === 'active';
                        }
                        const opening = new Date(ipo['Opening Date']);
                        const closing = new Date(ipo['Closing Date']);
                        return !isNaN(opening) && !isNaN(closing) && opening <= today && today <= closing;
                    });

                    const upcomingIPOs = data.filter(ipo => {
                        if (ipo['Status']) {
                            const st = String(ipo['Status']).trim().toLowerCase();
                            return st === 'upcoming';
                        }
                        const opening = new Date(ipo['Opening Date']);
                        return !isNaN(opening) && opening > today;
                    });

                    const closedIPOs = data.filter(ipo => {
                        if (ipo['Status']) {
                            const st = String(ipo['Status']).trim().toLowerCase();
                            return st === 'closed';
                        }
                        const opening = new Date(ipo['Opening Date']);
                        const closing = new Date(ipo['Closing Date']);
                        return !isNaN(closing) && (closing < today || (!isNaN(opening) && opening <= today && closing < today));
                    });

                    // Sort active by GMP desc, then total sub desc
                    activeIPOs.sort((a, b) => {
                        const gmpDiff = getGMP(b) - getGMP(a);
                        if (gmpDiff !== 0) return gmpDiff;
                        return getApps(b) - getApps(a);
                    });

                    // Sort upcoming by Date asc, then GMP desc
                    upcomingIPOs.sort((a, b) => {
                        const dateA = new Date(a['Opening Date'] || a['Closing Date']);
                        const dateB = new Date(b['Opening Date'] || b['Closing Date']);
                        if (!isNaN(dateA) && !isNaN(dateB)) {
                            if (dateA < dateB) return -1;
                            if (dateA > dateB) return 1;
                        }
                        return getGMP(b) - getGMP(a);
                    });

                    // Sort closed by Closing Date desc, then GMP desc
                    closedIPOs.sort((a, b) => {
                        const dateA = new Date(a['Closing Date'] || a['Opening Date']);
                        const dateB = new Date(b['Closing Date'] || b['Opening Date']);
                        if (!isNaN(dateA) && !isNaN(dateB)) {
                            if (dateB > dateA) return 1;
                            if (dateA > dateB) return -1;
                        }
                        return getGMP(b) - getGMP(a);
                    });

                    // Render the 3 tables directly
                    tableContainer.appendChild(createSection(activeIPOs, 'Active IPOs', true));
                    tableContainer.appendChild(createSection(upcomingIPOs, 'Upcoming IPOs', false));
                    tableContainer.appendChild(createSection(closedIPOs, 'Closed IPOs', false));
                })
                .catch(err => {
                    console.error('Error loading IPO data:', err);
                    document.getElementById('ipo-table-container').innerHTML = 
                        '<div class="empty-message">Failed to load IPO data. Please refresh the page.</div>';
                });
        });
    </script>
</body>

</html>
