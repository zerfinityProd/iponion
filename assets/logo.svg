<svg width="250" height="65" viewBox="0 0 250 65" xmlns="http://www.w3.org/2000/svg">
  <style>
    .logo-font {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -0.01em;
    }
    .brand-green {
      fill: #00FF00;
    }
    .brand-dark {
      fill: #1e293b;
    }
    @media (prefers-color-scheme: dark) {
      .brand-dark {
        fill: #f1f5f9;
      }
    }
  </style>

  <!-- Icon: progressively blended rising bars -->
  <rect x="6" y="32" width="11" height="18" rx="2.5" fill="#00FF00" opacity="0.45"/>
  <rect x="21" y="20" width="11" height="30" rx="2.5" fill="#00FF00" opacity="0.75"/>
  <rect x="36" y="8" width="11" height="42" rx="2.5" fill="#00FF00"/>

  <!-- Text part: IPONION in a single word without space -->
  <text x="60" y="42" class="logo-font"><tspan class="brand-green">IPO</tspan><tspan class="brand-dark">NION</tspan></text>
</svg>
